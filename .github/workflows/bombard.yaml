name: bombard req roc

on:
  workflow_dispatch:

jobs:
  test-roc-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ROC Agent (Docker)
        uses: Securable-ai/roc-agent@v0.0.0
        with:
          server_url: https://api.codexsecurity.io/graphql
          api_key: ${{ secrets.ROC_API_KEY }}
          project_name: ${{ github.repository }}
          print_only: false
          debug: false

      - name: Bombard targets with regex-validated requests
        env:
          TOTAL_REQUESTS: 100
          PARALLELISM: 20
          CONTAINER_REQUESTS: 30
          MATCH_REGEX: '1234'
        run: |
          set -euo pipefail

          TARGETS=(
            "https://httpbin.org/post"
            "https://postman-echo.com/post"
          )

          echo "[*] TOTAL_REQUESTS=$TOTAL_REQUESTS"
          echo "[*] PARALLELISM=$PARALLELISM"
          echo "[*] CONTAINER_REQUESTS=$CONTAINER_REQUESTS"
          echo "[*] MATCH_REGEX=$MATCH_REGEX"
          echo "[*] TARGET COUNT=${#TARGETS[@]}"

          pick_target() {
            echo "${TARGETS[$((RANDOM % ${#TARGETS[@]}))]}"
          }

          generate_matching_value() {
            # ALWAYS matches regex: 1234
            echo "token_1234_$(shuf -i 1000-9999 -n 1)"
          }

          assert_regex_match() {
            value="$1"
            if ! echo "$value" | grep -Eq "$MATCH_REGEX"; then
              echo "[!] REGEX ASSERTION FAILED"
              echo "    value=$value"
              echo "    regex=$MATCH_REGEX"
              exit 1
            fi
          }

          send_host() {
            id="$1"
            target="$(pick_target)"
            value="$(generate_matching_value)"

            assert_regex_match "$value"

            curl -sS -X POST "$target" \
              -H "Content-Type: application/json" \
              -H "X-Request-ID: host-$id-$value" \
              -d "{
                \"source\": \"host\",
                \"id\": \"$id\",
                \"token\": \"$value\",
                \"password\": \"pass_$value\",
                \"note\": \"regex_1234_test\"
              }" \
              --max-time 5 \
              -o /dev/null \
              && echo "✔ host-$id -> $target" \
              || echo "✖ host-$id -> $target"
          }

          send_container() {
            id="$1"
            target="$(pick_target)"
            value="$(generate_matching_value)"

            assert_regex_match "$value"

            docker run --rm curlimages/curl:8.5.0 \
              -sS -X POST "$target" \
              -H "Content-Type: application/json" \
              -H "X-Request-ID: container-$id-$value" \
              -d "{
                \"source\": \"container\",
                \"id\": \"$id\",
                \"token\": \"$value\",
                \"password\": \"pass_$value\",
                \"note\": \"regex_1234_test\"
              }" \
              --max-time 5 \
              -o /dev/null \
              && echo "✔ container-$id -> $target" \
              || echo "✖ container-$id -> $target"
          }

          export -f pick_target
          export -f generate_matching_value
          export -f assert_regex_match
          export -f send_host
          export -f send_container
          export MATCH_REGEX
          export TARGETS

          docker pull curlimages/curl:8.5.0

          seq 1 "$TOTAL_REQUESTS" | xargs -n1 -P "$PARALLELISM" bash -c '
            id=$1
            if [ "$id" -le "'"$CONTAINER_REQUESTS"'" ]; then
              send_container "$id"
            else
              send_host "$id"
            fi
          ' _
