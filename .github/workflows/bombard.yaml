name: bombard req roc

on:
  workflow_dispatch:

jobs:
  test-roc-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ROC Agent (Docker)
        uses: Securable-ai/roc-agent@v0.0.0
        with:
          server_url: https://api.codexsecurity.io/graphql
          api_key: ${{ secrets.ROC_API_KEY }}
          project_name: ${{ github.repository }}
          print_only: false
          debug: false

      - name: Bombard same request across multiple websites
        env:
          PARALLELISM: 20
        run: |
          set -euo pipefail

          TARGETS=(
            "https://httpbin.org/post"
            "https://postman-echo.com/post"
            "https://webhook.site/replace-with-your-id"
          )

          QUERY="?test=12345667788764"
          PAYLOAD='{"data":"12345667788764"}'

          echo "[*] Running identical request against ${#TARGETS[@]} targets"

          send_request() {
            target="$1"

            curl -s -X POST "${target}${QUERY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              --max-time 5 \
              -o /dev/null \
              && echo "✔ sent -> $target" \
              || echo "✖ failed -> $target"
          }

          export -f send_request
          export QUERY
          export PAYLOAD

          printf "%s\n" "${TARGETS[@]}" | xargs -n1 -P "$PARALLELISM" bash -c '
            send_request "$1"
          ' _
