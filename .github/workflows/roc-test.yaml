name: Test ROC Action

on:
    push:
        branches: [main]

jobs:
    test-roc:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Create test config
              run: |
                  mkdir -p roc-config roc-output
                  cat > roc-config/pattern.yaml << EOF
                  patterns:
                    - id: "simple_number"
                      regex: "1234"
                  EOF

            - name: Run ROC Analysis
              uses: hanshal101/actions-ci@v1.0.5
              with:
                  server-url: "https://api.codexsecurity.io"
                  api-key: "dummyapikey1234567890"
                  patterns: "pattern.yaml"
                  config-dir: "roc-config"
                  output-dir: "roc-output"

            - name: Generate traffic matching pattern
              run: |
                  echo "Generating traffic that matches the pattern '1234'..."
                  curl -X POST "https://httpbin.org/post" \
                    -H "Content-Type: application/json" \
                    -d '{"data": "This contains a simple number 1234 for testing"}' \
                    --connect-timeout 10 \
                    --max-time 30 || true
                  sleep 20 # Allow time for ROC to process

            - name: Print ROC logs after traffic
              run: |
                  sleep 60
                  echo "Fetching ROC container logs after traffic generation..."
                  docker logs roc-test || true

            - name: Generate more traffic
              run: |
                  echo "Generating more traffic..."
                  curl -X GET "https://example.com?param=12345667788764" \
                    --connect-timeout 10 \
                    --max-time 30 || true
                  sleep 20 # Allow time for ROC to process

            - name: Print ROC logs again
              run: |
                  echo "Fetching ROC container logs after more traffic..."
                  docker logs roc-test || true

            - name: Show output files
              run: |
                  echo "Output files generated by ROC:"
                  ls -la roc-output/
                  cat roc-output/*.json || echo "No JSON output files found"

            - name: Cleanup
              if: always()
              run: |
                  docker stop roc-test 2>/dev/null || true
                  docker rm roc-test 2>/dev/null || true
                  echo "Container cleanup completed"
