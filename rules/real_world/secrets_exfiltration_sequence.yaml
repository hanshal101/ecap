apiVersion: v1
kind: O3Rules
metadata:
  id: secrets-exfiltration-sequence
  title: Secrets Exfiltration Sequence Detection
  description: Detects a sequence where secrets are accessed followed by network exfiltration
  category: Security Violation
  severity: critical
spec:
  severity: critical
  target:
    binary: any
  detection:
    sequence:
      steps:
        - id: secret-access
          file:
            read:
              path: [".env", "*.key", "*.secret", "config/secrets*", "credentials*"]
        - id: network-exfil
          network:
            connect:
              direction: outbound
              scope: external
              action: block
