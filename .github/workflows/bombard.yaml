name: bombard req roc

on:
  workflow_dispatch:

jobs:
  test-roc-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ROC Agent (Docker)
        uses: Securable-ai/roc-agent@v0.0.0
        with:
          server_url: https://api.codexsecurity.io/graphql
          api_key: ${{ secrets.ROC_API_KEY }}
          project_name: ${{ github.repository }}
          print_only: false
          debug: false
      
      - name: Bombard httpbin with identical requests (100x parallel)
        run: |
          set -euo pipefail
      
          TARGET="https://httpbin.org/post?test=12345667788764"
          PAYLOAD='{"data":"12345667788764"}'
          TOTAL=100
      
          echo "[*] Sending $TOTAL identical requests to httpbin.org in parallel"
      
          seq 1 "$TOTAL" | xargs -n1 -P "$TOTAL" bash -c '
            curl -s -X POST "'"$TARGET"'" \
              -H "Content-Type: application/json" \
              -d '"$PAYLOAD"' \
              --max-time 5 \
              -o /dev/null \
              && echo "✔ request sent" \
              || echo "✖ request failed"
          ' _
