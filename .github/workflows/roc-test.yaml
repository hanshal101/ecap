name: Test ROC Action Package with External Interaction
on:
  workflow_dispatch:

jobs:
  test-roc-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ROC patterns file
        run: |
          mkdir -p roc-config
          echo "patterns:" > roc-config/pattern.yaml
          echo "  - id: \"simple_number\"" >> roc-config/pattern.yaml
          echo "    regex: \"1234\"" >> roc-config/pattern.yaml
          echo "  - id: \"another_pattern\"" >> roc-config/pattern.yaml
          echo "    regex: \"SECRET_[A-Z0-9]{16}\"" >> roc-config/pattern.yaml
          echo "  - id: \"test_number\"" >> roc-config/pattern.yaml
          echo "    regex: \"12345667788764\"" >> roc-config/pattern.yaml

      - name: Start ROC Container with Custom Action
        id: roc-start
        uses: Securable-ai/roc-agent@v0.0.0
        with:
          server-url: https://api.codexsecurity.io
          api-key: ${{ secrets.ROC_API_KEY }}
          patterns: pattern.yaml
          config-dir: roc-config
          output-dir: my-roc-results
          additional-args: --restart=unless-stopped
          docker-image: public.ecr.aws/f9o7b7m0/roc

      # Step 2: Simulate curl traffic externally
      - name: Simulate curl traffic (send 12345667788764)
        run: |
          CONTAINER_ID="${{ steps.roc-start.outputs.container-id }}"
          echo "Sending traffic to container: $CONTAINER_ID"
          docker exec "$CONTAINER_ID" sh -c 'find / -name "libssl.so*" 2>/dev/null' || true
          ldd $(which curl) || true
          echo "Generating curl traffic..."
          curl -s https://example.com > /dev/null || true
          curl -s -X POST "https://httpbin.org/post?test=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"data":"12345667788764"}' \
            > /dev/null || true

      # Step 3: Print ROC logs externally
      - name: Print ROC logs
        run: |
          sleep 60
          CONTAINER_ID="${{ steps.roc-start.outputs.container-id }}"
          docker stop "$CONTAINER_ID" || true
          sleep 10
          echo "Fetching ROC container logs for: $CONTAINER_ID"
          docker logs "$CONTAINER_ID" || true

      # Optional: More traffic and final logs
      - name: More simulated curl traffic with 12345667788764
        run: |
          CONTAINER_ID="${{ steps.roc-start.outputs.container-id }}"
          curl -X POST "https://example.com?more=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"info":"12345667788764"}' > /dev/null || true
          sleep 60
          docker logs "$CONTAINER_ID" || true
          sleep 5
          docker exec "$CONTAINER_ID" sh -c 'cat /tmp/roc-output/secrets_*.json 2>/dev/null || echo "No secrets files found"' || true

      # Optional: Cleanup step
      - name: Cleanup ROC Container
        if: always() # Run even if previous steps failed
        run: |
          CONTAINER_ID="${{ steps.roc-start.outputs.container-id || 'roc-test' }}"
          docker rm -f "$CONTAINER_ID" || true
          rm -rf ./my-roc-results ./roc-config
