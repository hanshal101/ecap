name: eCapture Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -----------------------------
  # Basic ecapture sanity test
  # -----------------------------
  basic-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make ecapture executable
        run: chmod +x ecapture

      - name: Run ecapture in daemon mode
        run: |
          sudo ./ecapture all -m text \
            --project hanshal101/ecap \
            --api-key ${{ secrets.ECAPTURE_API_KEY }} \
            --server-url https://api.codexsecurity.io \
            > ecapture.log 2>&1 &

          echo $! > ecapture.pid
          sleep 5

          if ps -p $(cat ecapture.pid) > /dev/null; then
            echo "eCapture is running"
          else
            echo "eCapture failed to start"
            cat ecapture.log
            exit 1
          fi

          sleep 30
          sudo kill $(cat ecapture.pid)

      - name: Display ecapture logs
        run: |
          echo "=== eCapture Log Output ==="
          cat ecapture.log || true

  # -----------------------------
  # Host-level traffic test
  # -----------------------------
  host-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make ecapture executable
        run: chmod +x ecapture

      - name: Start ecapture in background
        run: |
          sudo ./ecapture all -m text \
            --project hanshal101/ecap \
            --api-key ${{ secrets.ECAPTURE_API_KEY }} \
            --server-url https://api.codexsecurity.io \
            > ecapture-host.log 2>&1 &

          echo $! > ecapture.pid
          sleep 5

      - name: Generate HTTP traffic from host
        run: |
          curl -s -X POST "https://httpbin.org/post?test=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"test":"12345667788764"}'
          echo ""

          cat > test_script.py << 'EOF'
          import requests
          import json
          
          response = requests.post(
              "https://httpbin.org/post?test=12345667788764",
              headers={"Content-Type": "application/json"},
              data=json.dumps({"test": "12345667788764"})
          )
          
          print(f"Response status: {response.status_code}")
          print(f"Response: {response.json()}")
          EOF

          python3 test_script.py

      - name: Stop ecapture
        run: |
          sleep 30
          sudo kill $(cat ecapture.pid) || true

      - name: Display host test logs
        run: |
          echo "=== eCapture Host Test Log Output ==="
          cat ecapture-host.log || true

  # -----------------------------
  # Container traffic test
  # -----------------------------
  container-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make ecapture executable
        run: chmod +x ecapture

      - name: Build test container
        run: |
          cat > Dockerfile.test << 'EOF'
FROM ubuntu:22.04

RUN apt-get update && apt-get install -y \
    curl \
    python3 \
    python3-pip \
    ca-certificates \
    && rm -rf /var/lib/apt/lists/*

RUN pip3 install requests

COPY ecapture /usr/local/bin/ecapture
RUN chmod +x /usr/local/bin/ecapture

COPY test.sh /test.sh
RUN chmod +x /test.sh

CMD ["/test.sh"]
EOF

          cat > test.sh << 'EOF'
#!/bin/bash
set -e

echo "Generating container traffic..."

curl -s -X POST "https://httpbin.org/post?test=container123" \
  -H "Content-Type: application/json" \
  -d '{"test":"container123"}'

python3 - << 'PY'
import requests, json
r = requests.post(
    "https://httpbin.org/post?test=container123",
    headers={"Content-Type": "application/json"},
    data=json.dumps({"test": "container123"})
)
print(r.status_code)
print(r.json())
PY
EOF

          docker build -f Dockerfile.test -t ecapture-test .

      - name: Start ecapture on host
        run: |
          sudo ./ecapture all -m text \
            --project hanshal101/ecap \
            --api-key ${{ secrets.ECAPTURE_API_KEY }} \
            --server-url https://api.codexsecurity.io \
            > ecapture-container.log 2>&1 &

          echo $! > ecapture.pid
          sleep 5

      - name: Run container workload
        run: docker run --rm ecapture-test

      - name: Stop ecapture
        run: |
          sleep 30
          sudo kill $(cat ecapture.pid) || true

      - name: Display container test logs
        run: |
          echo "=== eCapture Container Test Log Output ==="
          cat ecapture-container.log || true
