name: Run ROC Sensor Without Docker

on:
  workflow_dispatch:

jobs:
  run-roc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ROC binary exists and make executable
        run: |
          echo "Checking repo contents..."
          ls -l
          chmod +x ./roc
          echo "ROC binary is ready."

      - name: Install dependencies (libpcap + ssl)
        run: |
          echo "Installing system libraries..."
          sudo apt-get update
          sudo apt-get install -y libpcap0.8 libssl3 || sudo apt-get install -y libpcap0.8 libssl1.1
          echo "Installed dependencies:"
          ldconfig -p | grep -E "pcap|ssl" || true

      - name: Prepare config + output folders
        run: |
          mkdir -p ./roc-config ./roc-output
          cat <<'EOF' > ./roc-config/pattern.yaml
          patterns:
            - id: "simple_number"
              regex: "1234"
          EOF

      - name: Start ROC in background
        run: |
          echo "Starting ROC..."
          sudo ./roc \
            --server-url https://api.codexsecurity.io \
            --api-key dummyapikey1234567890 \
            --patterns ./roc-config/pattern.yaml \
            --watch ./roc-output \
            > roc.log 2>&1 &

          sleep 10
          echo "ROC started."

      - name: Trigger HTTP traffic (containing secret-like string)
        run: |
          echo "Simulating network traffic..."
          curl -s https://example.com > /dev/null || true

          curl -s -X POST "https://httpbin.org/post?test=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"data":"12345667788764"}' \
            > /dev/null || true

      - name: Print ROC logs and output
        run: |
          echo "Waiting for ROC to process data..."
          sleep 15

          echo "=== ROC Log Output ==="
          cat roc.log || true

          echo "=== ROC Output Directory ==="
          ls -l ./roc-output || true

          echo "=== ROC Detected Secrets ==="
          cat ./roc-output/secrets_*.json || echo "No findings yet"

      - name: More simulated curl traffic
        run: |
          curl -X POST "https://example.com?more=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"info":"12345667788764"}' > /dev/null || true

          sleep 10
          echo "=== Updated ROC Log ==="
          cat roc.log || true

      - name: Final cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          pkill roc || true
          rm -rf ./roc-config ./roc-output roc.log
