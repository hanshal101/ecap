name: Build, Push & Deploy TLS Inspector

on:
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu

    steps:
      - name: Pull latest image
        run: docker pull hanshal785/tls-interceptor:latest

      - name: Start TLS Inspector
        run: |
          docker rm -f tls-inspector-ci 2>/dev/null || true

          docker run -d \
            --name tls-inspector-ci \
            --privileged \
            --pid=host \
            --network=host \
            -v /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro \
            -v /sys/fs/bpf:/sys/fs/bpf \
            -v /proc:/proc \
            -v /etc/ld.so.conf.d:/etc/ld.so.conf.d:ro \
            hanshal785/tls-interceptor:latest run \
            --server-url https://webhook.site/b2dea0ab-5687-46da-a7dc-72a3eecc603c \
            --project-name ${{ github.repository }} \
            --usecase security-mon \
            --all-traffic

          echo "Waiting for inspector..."
          sleep 10

          docker logs tls-inspector-ci

      - name: Curl test
        run: |
          curl -X POST https://httpbin.org/post \
            -H "Content-Type: application/json" \
            -d '{"aws_key":"AKIA1234567890ABCDEF"}'

      - name: Wget test
        run: |
          wget --method=POST https://httpbin.org/post \
            --header="Content-Type: application/json" \
            --body-data='{"aws_key":"AKIA1234567890ABCDEF"}' \
            -O -

      - name: Python test
        run: |
          python3 - <<EOF
          import urllib.request, json
          data=json.dumps({"aws_key":"AKIA1234567890ABCDEF"}).encode()
          req=urllib.request.Request(
              "https://httpbin.org/post",
              data=data,
              headers={"Content-Type":"application/json"}
          )
          print(urllib.request.urlopen(req).read().decode())
          EOF

      - name: Wait for logs
        run: sleep 10

      - name: Show Logs
        if: always()
        run: docker logs tls-inspector-ci

      - name: Stop TLS Inspector
        if: always()
        run: docker rm -f tls-inspector-ci 2>/dev/null || true
