name: Test ROC Action Package with External Interaction
on:
  workflow_dispatch:

jobs:
  test-roc-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ROC Container with Custom Action
        id: roc-start
        uses: Securable-ai/roc-agent@v0.0.0
        with:
          server_url: https://api.codexsecurity.io
          api_key: ${{ secrets.ROC_API_KEY }}
          project_name: ${{ github.repository }}
          patterns_yaml: |
            patterns:
              - id: "simple_number"
                regex: "1234"
              - id: "another_pattern"
                regex: "SECRET_[A-Z0-9]{16}"
              - id: "test_number"
                regex: "12345667788764"
                
            whitelist:
              domains:
                - "google.com"
                - "httpbin.org"
              urls:
                - "https://google.com"
          output_dir: "./roc-results"
      #    args: "--restart=unless-stopped"

      # Step 2: Simulate curl traffic externally
      - name: Simulate curl traffic (send 12345667788764)
        run: |
            CONTAINER_NAME="${{ steps.roc-start.outputs.container_name }}" # Get the container name from the previous step's output
            echo "Sending traffic to container: $CONTAINER_NAME"
            echo 10
            docker logs "$CONTAINER_NAME"
            docker exec "$CONTAINER_NAME" sh -c 'find / -name "libssl.so*" 2>/dev/null'
            ldd $(which curl)
            echo "Generating curl traffic..."
            curl -s -X POST "https://httpbin.org/post?test=12345667788764" \
              -H "Content-Type: application/json" \
              -d '{"data":"12345667788764"}' \
              > /dev/null || true
            sleep 5
            curl google.com
            sleep 5
            curl china-world.china.org.cn
            curl -s https://example.com 
      # Step 3: Print ROC logs externally
      - name: Print ROC logs
        run: |
            sleep 60
              CONTAINER_NAME="${{ steps.roc-start.outputs.container_name }}"
              echo "Fetching ROC container logs for: $CONTAINER_NAME"
              docker logs "$CONTAINER_NAME" || true
      # Optional: More traffic and final logs
      - name: More simulated curl traffic with 12345667788764
        run: |
            CONTAINER_NAME="${{ steps.roc-start.outputs.container_name }}"
            curl -X POST "https://example.com?more=12345667788764" \
              -H "Content-Type: application/json" \
              -d '{"info":"12345667788764"}' > /dev/null || true
            sleep 60
            docker logs "$CONTAINER_NAME" || true
            sleep 5
            docker exec "$CONTAINER_NAME" sh -c 'cat /tmp/roc-output/secrets_*.json || true'
      # Optional: Cleanup step
      - name: Cleanup ROC Container
        if: always() # Run even if previous steps failed
        run: |
            CONTAINER_NAME="${{ steps.roc-start.outputs.container_name || 'roc-action-container' }}"
            docker rm -f "$CONTAINER_NAME" || true
            rm -rf ./my-roc-results # Or the default ./roc-action-output
