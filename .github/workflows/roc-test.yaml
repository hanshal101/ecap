name: Test ROC Action Package with Explicit Patterns
on:
    workflow_dispatch:

jobs:
    test-roc-action:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use ROC Action with Custom Patterns
              uses: hanshal101/actions-ci@main # Replace 'main' with the tag/branch containing dist/index.js
              with:
                  docker_image: hanshal785/roc:v5
                  server_url: https://api.codexsecurity.io
                  api_key: dummy123456789 # Use a secret for the API key
                  # Provide the patterns YAML content directly here
                  patterns_yaml: |
                      patterns:
                        - id: "simple_number"
                          regex: "1234"
                        - id: "another_pattern"
                          regex: "SECRET_[A-Z0-9]{16}"
                  output_dir_host_path: "./my-roc-results"
                  extra_docker_args: "--restart=unless-stopped" # Example of extra args

            # Optional: Cleanup step using the container name output
            - name: Cleanup ROC Container
              if: always() # Run even if the previous step failed
              run: |
                  CONTAINER_NAME="${{ steps.roc-action.outputs.container_name || 'roc-action-container' }}"
                  docker rm -f "$CONTAINER_NAME" || true
                  rm -rf ./my-roc-results # Or the default ./roc-action-output
