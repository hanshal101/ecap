name: Run ROC Sensor Without Docker

on:
  workflow_dispatch:

jobs:
  run-roc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ROC binary exists and make executable
        run: |
          ls -l .
          chmod +x ./roc
          echo "ROC binary ready."

      - name: Prepare config + output folders
        run: |
          mkdir -p ./roc-config ./roc-output
          cat <<'EOF' > ./roc-config/pattern.yaml
          patterns:
            - id: "simple_number"
              regex: "1234"
          EOF
          ls -l ./roc-config/

      - name: Start ROC in background
        run: |
          echo "Starting ROC..."
          ./roc \
            --server-url https://api.codexsecurity.io \
            --api-key dummyapikey1234567890 \
            --patterns ./roc-config/pattern.yaml \
            --watch ./roc-output \
            > roc.log 2>&1 &
          
          sleep 10
          echo "ROC started."

      - name: Trigger HTTP traffic containing target strings
        run: |
          echo "Generating HTTP traffic..."
          curl -s https://example.com > /dev/null || true

          curl -s -X POST "https://httpbin.org/post?test=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"data":"12345667788764"}' \
            > /dev/null || true

      - name: Print ROC logs + output
        run: |
          echo "Sleeping 15 seconds for ROC to process..."
          sleep 15
          echo "=== ROC Log Output ==="
          cat roc.log || true
          echo "=== ROC Findings Output ==="
          ls -l ./roc-output || true
          cat ./roc-output/secrets_*.json || true

      - name: More simulated curl traffic
        run: |
          curl -X POST "https://example.com?more=12345667788764" \
            -H "Content-Type: application/json" \
            -d '{"info":"12345667788764"}' > /dev/null || true

          sleep 15
          echo "=== Updated ROC Logs ==="
          cat roc.log || true

      - name: Another curl request (runner itself)
        run: |
          curl -X POST https://example.com \
            -H 'Content-Type: application/json' \
            -d '{"inside":"12345667788764"}'
          sleep 10
          cat roc.log || true

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          pkill roc || true
          rm -rf ./roc-config ./roc-output roc.log
