name: Test ROC Agent (Docker) lol

on:
  workflow_dispatch:

jobs:
  test-roc-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for release upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ROC Agent (Docker)
        id: roc-start
        uses: o3security/roc-agent@v0.0.1
        with:
          server_url: https://api.codexsecurity.io/graphql
          api_key: ${{ secrets.ROC_API_KEY }}
          project_name: ${{ github.repository }}
          print_only: false
          debug: true
          docker_image: hanshal785/roc-mainin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Simulate Network Traffic
        run: |
          echo "ROC process started with PID: ${{ steps.roc-start.outputs.roc_pid }}"
          echo "Waiting for ROC to initialize..."
          sleep 10

          echo "Running Node.js test..."
          if [ -f "nw.js" ]; then
            node nw.js
          else
            echo "nw.js not found"
          fi

          sleep 10

          echo "Generating curl traffic..."
          curl -X POST https://httpbin.org/post \
            -H "Content-Type: application/json" \
            -d '{"aws_key":"test_AKIA1234567890ABCDEF"}'

          curl -s google.com

          sleep 10

      - name: Save Docker Logs to docker.log
        run: |
          echo "Fetching docker logs..."

          # get any container using your ROC image
          CONTAINER_ID=$(docker ps -aq --filter "ancestor=hanshal785/roc-mainin" | head -1)

          if [ -n "$CONTAINER_ID" ]; then
            echo "Found container: $CONTAINER_ID"
            docker logs "$CONTAINER_ID" > docker.log 2>&1
          else
            echo "No container found" > docker.log
          fi

          ls -lh docker.log
          cat docker.log | tail -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: logs-${{ github.run_number }}
          name: ROC Logs Run ${{ github.run_number }}
          files: docker.log
          generate_release_notes: true

      - name: Cleanup
        run: |
          echo "ROC cleanup will run automatically"
