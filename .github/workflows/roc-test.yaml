name: Test ROC Action

on:
    push:
        branches: [main]

jobs:
    test-roc:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Create test config
              run: |
                  mkdir -p roc-config roc-output
                  cat > roc-config/pattern.yaml << EOF
                  patterns:
                    - id: "simple_number"
                      regex: "1234"
                  EOF

            - name: Run ROC Analysis
              uses: hanshal101/actions-ci@v1.0.3
              with:
                  server-url: "https://api.codexsecurity.io"
                  api-key: "dummyapikey1234567890"
                  patterns: "pattern.yaml"
                  config-dir: "roc-config"
                  output-dir: "roc-output"
